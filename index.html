<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatiCash Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="./css/main.css">
    <script src="./config.js"></script>
    <style>
        /* Critical Splash Screen Styles */
        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease;
        }

        .splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .splash-logo-main {
            width: 120px;
            height: auto;
            border-radius: 14px;
            animation: splash-float 3s ease-in-out infinite;
        }

        @keyframes splash-float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .splash-loader {
            display: flex;
            gap: 8px;
        }

        .splash-spinner {
            width: 10px;
            height: 10px;
            background: #2563eb;
            /* var(--color-primary) fallback */
            border-radius: 50%;
            animation: splash-dot 1.4s ease-in-out infinite;
        }

        @keyframes splash-dot {

            0%,
            80%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            40% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .splash-footer {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .splash-by {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #64748b;
            /* var(--color-text-muted) fallback */
            font-family: sans-serif;
        }

        .splash-logo-bomil {
            width: 60px;
            height: auto;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <img src="../assets/images/logo_caticash.png" alt="CatiCash" class="splash-logo-main">
            <div class="splash-loader">
                <div class="splash-spinner"></div>
            </div>
        </div>
        <div class="splash-footer">
            <span class="splash-by">Powered by</span>
            <img src="../assets/images/logo_bomil_solutions.png" alt="Bomil Solutions" class="splash-logo-bomil">
        </div>
    </div>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../assets/images/logo_caticash.png" alt="CatiCash" class="sidebar-logo">
                <span class="sidebar-title">CatiCash</span>
                <small class="sidebar-subtitle">Administration</small>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <!-- Dynamically populated -->
            </nav>
            <div class="sidebar-footer">
                <button type="button" class="btn btn-outline btn-block" id="logout-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Déconnexion
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button type="button" class="topbar-toggle" id="sidebar-toggle" aria-label="Menu">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <div class="topbar-title" id="page-title">Dashboard</div>
                <div class="topbar-user" id="topbar-user">Admin</div>
            </header>
            <div class="page-content" id="app">
                <!-- Views render here -->
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <div id="modal-root" class="modal-root" aria-hidden="true"></div>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
